<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>js-dos digger 8.xx</title>

    <style>
        html, body {
            height: 100%;
        }

        #dos {
            width: 100%;
            height: 100%;
        }
    </style>

    <!-- js-dos style sheet -->
    <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">

    <!-- js-dos -->
    <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
</head>
<body>

    <div id="dos" style="width: 100%; height: 100%"></div>

    <script>
        Dos(document.getElementById("dos"), {
            url: "./out-of-cash.jsdos",
			background: "title.png",
			  noNetworking: false,
			  noCursor: true,		  
			  renderAspect: "AsIs",
			  // renderBackend: "webgl",
			  imageRendering: "pixelated",
			  mouseCapture: true,
			  mouseSensitivity: 0.5,
			  backend: "dosboxX",
			  backendLocked: true,
			  theme: "dark",
			  autoStart: true,
        });
    </script>
</body>
</html>
