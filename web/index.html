<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Out of Cash (Sin blanca)</title>

    <style>
        html, body {
            height: 100%;
        }

        #dos {
            width: 100%;
            height: 100%;
        }
    </style>

    <!-- js-dos style sheet -->
    <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">

    <!-- js-dos -->
    <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
</head>
<body>

    <div id="dos" style="width: 100%; height: 100%"></div>

    <script>
        Dos(document.getElementById("dos"), {
              url: "./out-of-cash.jsdos",	//bundle file
			  background: "title.png",		//background title image
			  noNetworking: false,
			  noCursor: true,		  		//hide system cursor
			  renderAspect: "AsIs",			  
			  imageRendering: "pixelated",
			  mouseCapture: true,			//better for mouse games
			  mouseSensitivity: 0.5,		
			  backend: "dosboxX",			//dosbox-x works better
			  backendLocked: true,			//disable backend change
			  theme: "dark",
			  autoStart: true,			  
			  thinSidebar: true,			//dosplayer UI minimized
			  // renderBackend: "webgl",			  
			  //kiosk: true,				//dosplayer UI hide
			  //fullScreen: true,			//put game on fullscreen			  
        });
    </script>
</body>
</html>
